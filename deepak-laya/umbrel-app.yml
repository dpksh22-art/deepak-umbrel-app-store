  - https://raw.githubusercontent.com/NandhaKishorM/laya/main/assets/logo-mark.svg
releaseNotes: >-
  Fix PermissionError on model-cache: run the server as root (user 0:0) so the
  Umbrel-owned APP_DATA_DIR volume is writable during LAYA_PRELOAD. Image remains
  ghcr.io/dpksh22-art/laya:0.3.21. Port 8783 via app proxy.
