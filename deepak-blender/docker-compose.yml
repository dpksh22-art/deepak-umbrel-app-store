version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: deepak-blender_server_1
      APP_PORT: 3000

  server:
    image: linuxserver/blender:4.4.3-ls169@sha256:391c8ed76c41badaf8ec563663af67cb9f3871ebf03f765bbe33af6912fec4b4
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
