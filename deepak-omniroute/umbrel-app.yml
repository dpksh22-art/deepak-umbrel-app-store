description: >-
  Never stop coding. OmniRoute is a free MIT AI gateway with one OpenAI-compatible
  endpoint for 352 providers (150+ free) and 1200+ models including Kimi, Claude,
  GPT, Gemini, GLM, DeepSeek, and MiniMax.


  Works with Claude Code, Codex, Cursor, OpenCode, Cline, Copilot, and any
  OpenAI-compatible tool. Features quota-aware auto-fallback, RTK+Caveman
  compression (saves 15–95% tokens), MCP/A2A support, and a built-in dashboard.


  Built by 550+ contributors. Source: https://github.com/diegosouzapw/OmniRoute


  Note: If you already have the official Umbrel OmniRoute app installed (port
  20128), do not install both at once — this community package uses port 20129
  to avoid a conflict.
