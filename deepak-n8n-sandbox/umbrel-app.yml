manifestVersion: 1
id: deepak-n8n-sandbox
name: n8n Sandbox
tagline: Code sandbox for n8n Assistant (self-hosted)
icon: https://raw.githubusercontent.com/n8n-io/n8n/master/assets/n8n-logo.png
category: developer
version: "1.3.4"
port: 3200
description: >-
  Self-hosted n8n Sandbox Service (API + privileged Docker-in-Docker runner)
  for n8n Assistant on Umbrel.


  After install, in n8n open Settings → n8n Assistant → Add a code sandbox →
  n8n Sandbox, and set:


  - Service URL: http://100.111.166.3:3200 (or http://umbrel.local:3200 on LAN)


  - API key: ask Server engineer (also written to CONNECTION.txt in app data)


  Requires a model provider API key in n8n Assistant as well. Home/Tailscale
  use only — the runner is privileged Docker-in-Docker.
developer: n8n (packaged by Deepak)
website: https://docs.n8n.io/deploy/host-n8n/configure-n8n/set-up-n8n-assistant/
submitter: Deepak Sahu
submission: https://github.com/n8n-io/n8n-sandbox-service
repo: https://github.com/n8n-io/n8n-sandbox-service
support: https://github.com/n8n-io/n8n-sandbox-service/issues
gallery: []
releaseNotes: >-
  Fix Umbrel install: remove host port publish (conflicts with app proxy),
  pin sandbox service 1.3.4, soften runner startup dependency.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
