version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: deepak-n8n-sandbox_api_1
      APP_PORT: 8080

  certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.3.4
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >
        rm -rf /tls/* /tls/.[!.]* 2>/dev/null; true;
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls &&
        mkdir -p /data &&
        printf '%s\n' "Service URL (Tailscale): http://100.111.166.3:3200" "Service URL (LAN): http://umbrel.local:3200" "API key: z5hQ-OHNRmQuXiXYadko-RL1IWBZLINkgzRmzEnycrY" "Health: curl -sf http://100.111.166.3:3200/healthz" > /data/CONNECTION.txt
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - ${APP_DATA_DIR}/tls:/tls
      - ${APP_DATA_DIR}/data:/data

  api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.3.4
    hostname: sandbox-api
    restart: on-failure
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: "z5hQ-OHNRmQuXiXYadko-RL1IWBZLINkgzRmzEnycrY"
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: "B_hhISlHZPQNulpe8oY9qr3oGSvVCnMehaF2V1Kqt_Y"
      SANDBOX_API_RUNNER_API_KEY: "rIZEabUWYG99FPLzvnNDg0Z-aUgzh2UnmaS5eUuZQQE"
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - ${APP_DATA_DIR}/tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  runner:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.3.4
    hostname: sandbox-runner-1
    restart: on-failure
    privileged: true
    depends_on:
      - api
    environment:
      SANDBOX_RUNNER_REGISTRATION_TOKEN: "B_hhISlHZPQNulpe8oY9qr3oGSvVCnMehaF2V1Kqt_Y"
      SANDBOX_RUNNER_API_KEYS: "rIZEabUWYG99FPLzvnNDg0Z-aUgzh2UnmaS5eUuZQQE"
      SANDBOX_RUNNER_API_GRPC_ADDR: deepak-n8n-sandbox_api_1:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://deepak-n8n-sandbox_runner_1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: deepak-n8n-sandbox_runner_1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.3.4
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - ${APP_DATA_DIR}/tls:/tls:ro
