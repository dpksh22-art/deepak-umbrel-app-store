version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: deepak-gods-eye-view_server_1
      APP_PORT: 4173

  server:
    build: .
    image: deepak-gods-eye-view:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - HOST=0.0.0.0
      - PORT=4173
    volumes:
      - ${APP_DATA_DIR}/data:/app/.env-data
