manifestVersion: 1
id: deepak-gods-eye-view
name: God's Eye View
tagline: Live planes, ships, satellites and more on a 3D globe
icon: https://raw.githubusercontent.com/bilawalsidhu/gods-eye-view/main/public/logo.svg
category: networking
version: "1.0.0"
port: 8782
description: >-
  God's Eye View is a browser-based live spatial intelligence console — planes,
  ships, satellites, wildfires, cameras, and more on a photorealistic 3D globe.


  Optional API keys (Google Maps, Cesium ion, OpenAI, OpenSky, AISStream, etc.)
  can be added in-app via Provider Settings. The app also runs without keys on
  free basemap layers.


  Note: Upstream is oriented around Pinokio / local npm run; this Umbrel package
  runs the same Node/Vite server in Docker. First install builds from GitHub.


  Source: https://github.com/bilawalsidhu/gods-eye-view
developer: Bilawal Sidhu
website: https://github.com/bilawalsidhu/gods-eye-view
submitter: Deepak Sahu
submission: https://github.com/bilawalsidhu/gods-eye-view
repo: https://github.com/bilawalsidhu/gods-eye-view
support: https://github.com/bilawalsidhu/gods-eye-view/issues
gallery:
  - https://raw.githubusercontent.com/bilawalsidhu/gods-eye-view/main/public/logo.svg
releaseNotes: >-
  Initial community packaging of God's Eye View (built from source on install).
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
