version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: deepak-openmaic_server_1
      APP_PORT: 3000

  server:
    image: devprincekumar/openmaic:v1
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
